# The Churn for Windows: one TheChurn.exe, no Python needed.
# Built on a Windows runner by examples/churn/python_version/build_exe.py,
# checked with its --selftest, kept as a workflow artifact, and (from main)
# published as the "churn-latest" release, so the download link never changes:
# https://github.com/gabecamp/solar_os/releases/download/churn-latest/TheChurn.exe
name: The Churn - Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/churn/churn.lua
      - examples/churn/python_version/**
      - .github/workflows/churn-windows.yml

permissions:
  contents: write   # (to publish the release)

concurrency:
  group: churn-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: examples/churn/python_version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygame-ce, lupa and PyInstaller (wheels only)
        run: python -m pip install --only-binary ":all:" pygame-ce lupa pyinstaller

      - name: Build TheChurn.exe
        run: python build_exe.py

      - name: Self-test the exe (plays a few keys headless)
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          $p = Start-Process -FilePath dist\TheChurn.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content (Join-Path $env:TEMP "churn_selftest.txt")
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: TheChurn-windows
          path: examples/churn/python_version/dist/TheChurn.exe

      - name: Publish as the churn-latest release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete churn-latest --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create churn-latest dist\TheChurn.exe `
            --target $env:GITHUB_SHA `
            --title "The Churn for Windows (latest)" `
            --notes "Built from $env:GITHUB_SHA. Download TheChurn.exe and run it: no install, no Python. Windows may warn that the app is unrecognized (it isn't signed): More info, then Run anyway. Saves go to %APPDATA%\TheChurn." `
            --prerelease
